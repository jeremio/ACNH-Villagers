# Nom du workflow
name: CI Checks

# Déclencheurs du workflow
on:
  push:
    branches: [main, master] # On inclut 'main' et 'master' pour être sûr
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    # L'environnement d'exécution
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Spécifier la version de Node.js.
        node-version: [26.x]

    steps:
      # 1. Récupération du code du dépôt
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Configuration de pnpm
      # La version est lue depuis le champ "packageManager" de package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      # 3. Configuration de Node.js avec le cache pnpm
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # 4. Installation des dépendances
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Audit de sécurité des dépendances
      - name: Run security audit
        run: pnpm audit --audit-level=moderate
        continue-on-error: true

      # 6. Lancement des vérifications statiques (linting, types)
      - name: Run linter
        run: pnpm run lint
      - name: Run TypeScript type check
        run: pnpm run type-check

      # 7. Lancement des tests unitaires
      - name: Run unit tests
        run: pnpm run test

      # 8. Installation des navigateurs pour Playwright
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      # 9. Construction de l'application pour la production
      # Cette étape est cruciale pour que les tests e2e tournent sur le code final
      - name: Build project
        run: pnpm run build

      # 10. Lancement des tests de bout en bout (E2E) sur le build de production
      # Assurez-vous que votre script "test:e2e" utilise la configuration webServer de Playwright
      # qui lance `pnpm run preview` pour servir le dossier `dist`.
      - name: Run e2e tests
        run: pnpm run test:e2e

      # 11. Affichage de la taille du build pour information
      - name: Display build folder size
        run: |
          echo "Build output in 'dist/':"
          ls -lh dist/
          echo "Total size of 'dist/' folder:"
          du -sh dist/

      # 12. Lighthouse CI - Audit de performance
      - name: Run Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.x autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # 13. Génération du rapport d'analyse du bundle (mode analyze)
      - name: Generate visualizer report
        run: pnpm run analyze

      # 14. Téléversement du rapport d'analyse du build comme artefact
      - name: Upload visualizer report
        uses: actions/upload-artifact@v7
        with:
          name: visualizer-report
          path: dist/stats.html
          if-no-files-found: warn # Ne fait pas échouer le job si le rapport est absent.
